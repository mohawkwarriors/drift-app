<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drift</title>

  <!-- Favicons and Touch Icons with Cache Busting -->
  <link rel="icon" type="image/png" href="./icon.png?v=3" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3" />
  <link rel="manifest" href="./site.webmanifest?v=3" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap');

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "SF Pro Rounded", ui-rounded, "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      user-select: none; 
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      height: 100dvh; 
      overflow: hidden; 
      overscroll-behavior: none; 
      position: fixed; 
    }
    
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      transition: background 2s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    
    /* Morning Theme */
    body.day-mode { 
      background: radial-gradient(circle at 50% 25%, #fff7ed 0%, #ffedd5 35%, #fed7aa 65%, #e0e7ff 100%); 
      color: #1e293b; 
    }
    
    /* Night Theme */
    body.night-mode { 
      background: radial-gradient(circle at 50% 32%, #0f1322 0%, #080a14 55%, #030408 100%); 
      color: #f1f5f9; 
    }

    /* =========================================================
       FROSTED GLASS CANVAS
       ========================================================= */
    .glass-canvas {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 840px;
      border-radius: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 20px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      transition: background 1.5s ease, border-color 1.5s ease, box-shadow 1.5s ease;
      overflow: hidden;
    }

    .day-mode .glass-canvas {
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 
        0 20px 45px -10px rgba(251, 146, 60, 0.15),
        0 30px 60px -15px rgba(0, 0, 0, 0.05),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .night-mode .glass-canvas {
      background: rgba(15, 20, 36, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    /* =========================================================
       TOP BAR & TRACKER
       ========================================================= */
    .top-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
      transition: opacity 0.4s ease;
    }

    .top-bar {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      position: relative;
      transition: opacity 0.4s ease;
    }

    h1 { 
      font-size: 25px; 
      font-weight: 600; 
      letter-spacing: 0.5px; 
      opacity: 0.9; 
      transition: opacity 0.8s ease; 
    }
    h1.hidden { opacity: 0; }

    .streak-badge { 
      font-size: 13px; 
      font-weight: 600; 
      letter-spacing: 0.2px; 
      opacity: 0; 
      transform: translateY(4px); 
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); 
      position: absolute; 
      top: 28px; 
      white-space: nowrap; 
    }
    .day-mode .streak-badge { color: #ea580c; }
    .night-mode .streak-badge { color: #a78bfa; }
    .streak-badge.visible { opacity: 1; transform: translateY(0); }

    /* Theme Switcher */
    .theme-switch-btn {
      position: relative;
      width: 54px;
      height: 30px;
      padding: 3px;
      border-radius: 9999px;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      background: transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
    }
    .theme-switch-btn:active { transform: scale(0.95); }

    .day-mode .theme-switch-btn {
      background: rgba(255, 255, 255, 0.65);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 10px rgba(251, 146, 60, 0.12);
    }
    .night-mode .theme-switch-btn {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .track-icons {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7px;
      pointer-events: none;
    }

    .track-sun { color: #f97316; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
    .day-mode .track-sun { opacity: 0.95; }
    .night-mode .track-sun { opacity: 0.2; }

    .track-moon { display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
    .day-mode .track-moon { opacity: 0.2; color: #94a3b8; }
    .night-mode .track-moon { opacity: 0.95; color: #c084fc; }

    .switch-thumb {
      position: relative;
      z-index: 2;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease, box-shadow 0.3s ease;
    }
    .day-mode .switch-thumb {
      transform: translate3d(0, 0, 0);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(234, 88, 12, 0.25);
    }
    .night-mode .switch-thumb {
      transform: translate3d(24px, 0, 0);
      background: #4338ca;
      border: 1px solid rgba(192, 132, 252, 0.4);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Minimalist Cycle Droplets */
    .cycles-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
    }
    .cycles-row.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .day-mode .cycles-row {
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .night-mode .cycles-row {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mini-blob-slot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
    }
    .day-mode .mini-blob-slot { background: rgba(0, 0, 0, 0.08); }
    .night-mode .mini-blob-slot { background: rgba(255, 255, 255, 0.12); }

    .mini-blob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform: scale(0);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    .day-mode .mini-blob {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      box-shadow: 0 0 6px rgba(251, 146, 60, 0.6);
    }
    .night-mode .mini-blob {
      background: linear-gradient(135deg, #a855f7, #38bdf8);
      box-shadow: 0 0 7px rgba(168, 85, 247, 0.65);
    }

    .mini-blob-slot.active .mini-blob {
      opacity: 0.7;
      transform: scale(0.65);
      animation: miniPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes miniPulse {
      0% { transform: scale(0.5); opacity: 0.5; }
      100% { transform: scale(0.85); opacity: 0.95; }
    }

    .mini-blob-slot.completed .mini-blob {
      opacity: 1;
      transform: scale(1.15);
      animation: miniPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes miniPop {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    /* =========================================================
       DURATION CAPSULE
       ========================================================= */
    .duration-container {
      position: absolute;
      top: 96px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 15;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .duration-container.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .duration-capsule {
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      gap: 4px;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    .day-mode .duration-capsule {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 16px rgba(251, 146, 60, 0.1);
    }
    .night-mode .duration-capsule {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .duration-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      opacity: 0.55;
    }
    .day-mode .duration-tab { color: #1e293b; }
    .night-mode .duration-tab { color: #cbd5e1; }

    .tab-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .tab-time {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.65;
    }

    .duration-tab.active {
      opacity: 1;
      transform: scale(1.02);
    }
    .day-mode .duration-tab.active {
      background: rgba(255, 255, 255, 0.9);
      color: #ea580c;
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.18);
    }
    .night-mode .duration-tab.active {
      background: rgba(255, 255, 255, 0.12);
      color: #c084fc;
      box-shadow: 0 2px 12px rgba(168, 85, 247, 0.35);
    }

    /* =========================================================
       FLUID DRIFT STAGE
       ========================================================= */
    .blob-area { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      position: relative; 
      isolation: isolate;
    }

    .blob-halo { 
      position: absolute; 
      width: 280px; 
      height: 280px; 
      border-radius: 50%; 
      pointer-events: none; 
      filter: blur(65px); 
      opacity: 0.45; 
      transform: scale(1); 
      transition: opacity 2s ease, transform 2s ease, background 2s ease; 
      will-change: transform, opacity; 
    }
    .day-mode .blob-halo { 
      background: radial-gradient(circle, rgba(251, 146, 60, 0.45), rgba(244, 63, 94, 0.25) 55%, rgba(253, 224, 71, 0.15) 75%, transparent); 
    }
    .night-mode .blob-halo { 
      background: radial-gradient(circle, rgba(124, 58, 237, 0.4), rgba(79, 70, 229, 0.25) 50%, rgba(2, 132, 199, 0.15) 70%, transparent); 
    }

    .blob-mover { 
      position: absolute; 
      width: 148px; 
      height: 148px; 
      z-index: 2; 
      transform: translate3d(0, 130px, 0); 
      will-change: transform; 
      cursor: pointer; 
    }

    .blob-scaler { 
      width: 100%; 
      height: 100%; 
      transform-origin: center center; 
      transform: scale3d(1, 1, 1); 
      will-change: transform; 
    }

    .fluid-core { 
      width: 100%; 
      height: 100%; 
      position: relative; 
      animation: morphPureFluid 10s ease-in-out infinite alternate, fluidShimmer 16s linear infinite; 
      transition: background 2s ease, box-shadow 2s ease; 
      will-change: border-radius, background-position, transform; 
      outline: 1px solid transparent; 
      -webkit-backface-visibility: hidden; 
      backface-visibility: hidden; 
      transform: translateZ(0); 
    }

    .day-mode .fluid-core { 
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 30%, #ff6b8b 65%, #ffd166 100%); 
      background-size: 160% 160%; 
      box-shadow: 
        inset 10px 10px 24px rgba(255, 255, 255, 0.55), 
        inset -10px -10px 24px rgba(194, 65, 12, 0.18), 
        0 20px 45px rgba(249, 115, 22, 0.22), 
        0 0 1px 0.5px rgba(255, 255, 255, 0.4); 
    }

    .night-mode .fluid-core { 
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 35%, #3b82f6 70%, #0284c7 100%); 
      background-size: 170% 170%; 
      box-shadow: 
        inset 10px 10px 24px rgba(255, 255, 255, 0.35), 
        inset -10px -10px 24px rgba(15, 23, 42, 0.45), 
        0 20px 50px rgba(99, 102, 241, 0.35), 
        0 0 1px 0.5px rgba(192, 132, 252, 0.35); 
    }

    @keyframes morphPureFluid {
      0%   { border-radius: 46% 54% 53% 47% / 48% 46% 54% 52%; transform: rotate(0deg); }
      33%  { border-radius: 54% 46% 47% 53% / 52% 54% 46% 48%; transform: rotate(1.5deg); }
      66%  { border-radius: 48% 52% 54% 46% / 46% 48% 52% 54%; transform: rotate(-1.5deg); }
      100% { border-radius: 53% 47% 48% 52% / 54% 52% 48% 46%; transform: rotate(0.8deg); }
    }

    @keyframes fluidShimmer {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes gentleLevitate { 
      0%   { transform: translate3d(0, 130px, 0); }
      50%  { transform: translate3d(0, 114px, 0); }
      100% { transform: translate3d(0, 130px, 0); }
    }
    .blob-mover.idle { animation: gentleLevitate 5s ease-in-out infinite; }

    /* =========================================================
       BREATHING CADENCE KEYFRAMES
       ========================================================= */
    @keyframes fluidMoveBox {
      0% { transform: translate3d(0, 130px, 0); }
      25% { transform: translate3d(0, -60px, 0); }
      50% { transform: translate3d(0, -62px, 0); }
      75% { transform: translate3d(0, 130px, 0); }
      100% { transform: translate3d(0, 130px, 0); }
    }

    @keyframes harmonicBreathScaleBox {
      0% { transform: scale3d(1, 1, 1); }
      25% { transform: scale3d(1.85, 1.85, 1); }
      50% { transform: scale3d(1.88, 1.88, 1); }
      75% { transform: scale3d(1, 1, 1); }
      100% { transform: scale3d(1.02, 1.02, 1); }
    }

    @keyframes haloPulseBox {
      0% { opacity: 0.3; transform: scale(0.95); }
      25% { opacity: 0.85; transform: scale(1.65); }
      50% { opacity: 0.88; transform: scale(1.68); }
      75% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }

    @keyframes fluidMove478 {
      0% { transform: translate3d(0, 130px, 0); }
      21.05% { transform: translate3d(0, -60px, 0); }
      57.89% { transform: translate3d(0, -62px, 0); }
      100% { transform: translate3d(0, 130px, 0); }
    }

    @keyframes harmonicBreathScale478 {
      0% { transform: scale3d(1, 1, 1); }
      21.05% { transform: scale3d(1.85, 1.85, 1); }
      57.89% { transform: scale3d(1.88, 1.88, 1); }
      100% { transform: scale3d(1, 1, 1); }
    }

    @keyframes haloPulse478 {
      0% { opacity: 0.3; transform: scale(0.95); }
      21.05% { opacity: 0.85; transform: scale(1.65); }
      57.89% { opacity: 0.88; transform: scale(1.68); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }

    /* Active Animation Classes with Shared Timing Curve */
    .blob-mover.breathing-box { animation: fluidMoveBox 16s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .blob-mover.breathing-box .blob-scaler { animation: harmonicBreathScaleBox 16s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .blob-halo.breathing-box { animation: haloPulseBox 16s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }

    .blob-mover.breathing-478 { animation: fluidMove478 19s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .blob-mover.breathing-478 .blob-scaler { animation: harmonicBreathScale478 19s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .blob-halo.breathing-478 { animation: haloPulse478 19s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }

    @keyframes celebrate { 
      0%   { transform: scale3d(1, 1, 1) translate3d(0, 130px, 0); }
      35%  { transform: scale3d(1.18, 1.18, 1) translate3d(0, 50px, 0); }
      70%  { transform: scale3d(0.95, 0.95, 1) translate3d(0, 138px, 0); }
      100% { transform: scale3d(1, 1, 1) translate3d(0, 130px, 0); }
    }
    .blob-mover.done { animation: celebrate 1.2s cubic-bezier(0.25, 1, 0.5, 1); }

    /* =========================================================
       CALMING INK-DRIFT NUMBERS & PHASE
       ========================================================= */
    .phase-wrap {
      position: absolute;
      transform: translate3d(0, -60px, 0);
      display:
