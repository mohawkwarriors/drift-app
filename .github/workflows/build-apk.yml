name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f "drift_20260920.html" ]; then
            cp drift_20260920.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            first_html=$(ls *.html 2>/dev/null | head -n 1)
            [ -n "$first_html" ] && cp "$first_html" www/index.html
          fi
          cp *.html *.js *.css *.json *.png *.svg www/ 2>/dev/null || true

      - name: Setup Capacitor & Generate Android Project
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Drift" "com.mohawkwarriors.drift" --web-dir www
          fi

          npx cap add android || true
          npx cap sync android

          # Align Kotlin libraries to eliminate duplicate class conflicts
          printf "\nconfigurations.all {\n  resolutionStrategy {\n    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n  }\n}\n" >> android/app/build.gradle

      - name: Generate and Inject Blob App Icons
        run: |
          python3 -m pip install Pillow
          python3 -c "
          import os, glob
          from PIL import Image, ImageDraw, ImageFilter

          res_dir = 'android/app/src/main/res'

          # 1. Remove default Capacitor vector overrides that take precedence over mipmap PNGs
          for pattern in ['drawable*/ic_launcher_foreground.xml', 'drawable*/ic_launcher_background.xml']:
              for f in glob.glob(os.path.join(res_dir, pattern)):
                  try:
                      os.remove(f)
                      print(f'Removed vector override: {f}')
                  except Exception as e:
                      print(f'Could not remove {f}: {e}')

          # 2. Locate or create the source icon
          candidates = ['icon.png', 'Icon.png', 'blob.png', 'assets/icon.png', 'assets/icon-only.png']
          icon_path = next((c for c in candidates if os.path.exists(c)), None)

          if icon_path:
              print(f'Using uploaded icon: {icon_path}')
              img = Image.open(icon_path).convert('RGBA')
          else:
              print('No icon image found in repo. Generating fluid blob icon automatically...')
              size = 1024
              img = Image.new('RGBA', (size, size), (243, 225, 213, 255))
              center = size // 2
              draw = ImageDraw.Draw(img)
              draw.ellipse([center - 280, center - 280, center + 280, center + 280], fill=(255, 133, 132, 255))

          def make_rounded(source_img, size, radius_ratio=0.2237):
              resized = source_img.resize((size, size), Image.Resampling.LANCZOS)
              scale = 4
              w, h = size * scale, size * scale
              mask = Image.new('L', (w, h), 0)
              draw = ImageDraw.Draw(mask)
              radius = int(w * radius_ratio)
              draw.rounded_rectangle([0, 0, w, h], radius=radius, fill=255)
              mask = mask.resize((size, size), Image.Resampling.LANCZOS)
              out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              out.paste(resized, (0, 0), mask=mask)
              return out

          def make_circle(source_img, size):
              resized = source_img.resize((size, size), Image.Resampling.LANCZOS)
              scale = 4
              w, h = size * scale, size * scale
              mask = Image.new('L', (w, h), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse([0, 0, w, h], fill=255)
              mask = mask.resize((size, size), Image.Resampling.LANCZOS)
              out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              out.paste(resized, (0, 0), mask=mask)
              return out

          # 3. Inject standard, round, and adaptive foreground icons into all density folders
          sizes = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432)
          }
          for folder, (std_size, fg_size) in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              make_rounded(img, std_size).save(os.path.join(target_dir, 'ic_launcher.png'))
              make_circle(img, std_size).save(os.path.join(target_dir, 'ic_launcher_round.png'))
              img.resize((fg_size, fg_size), Image.Resampling.LANCZOS).save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          # 4. Inject rounded icons into www/ for web/PWA runtime
          web_targets = {
              'www/apple-touch-icon.png': 180,
              'www/android-chrome-192x192.png': 192,
              'www/android-chrome-512x512.png': 512,
              'www/favicon-32x32.png': 32,
              'www/favicon-16x16.png': 16
          }
          for p, s in web_targets.items():
              make_rounded(img, s).save(p)

          # 5. Set the adaptive background color to match the cream/peach background
          bg_file = os.path.join(res_dir, 'values', 'ic_launcher_background.xml')
          os.makedirs(os.path.dirname(bg_file), exist_ok=True)
          with open(bg_file, 'w') as f:
              f.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#F3E1D5</color>\n</resources>\n')

          # 6. Ensure adaptive icon XMLs explicitly point to @mipmap/ic_launcher_foreground
          anydpi_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <background android:drawable=\"@color/ic_launcher_background\"/>\n    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>\n</adaptive-icon>\n'''
          for xml_name in ['ic_launcher.xml', 'ic_launcher_round.xml']:
              with open(os.path.join(anydpi_dir, xml_name), 'w') as f:
                  f.write(adaptive_xml)

          print('All Android launcher, adaptive, and web assets successfully injected!')
          "

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drift-App-Debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
