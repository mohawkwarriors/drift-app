name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Image Library
        run: python3 -m pip install --upgrade Pillow

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json site.webmanifest sw.js *.png favicon.ico www/ 2>/dev/null || true

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android Platform
        run: |
          npx cap add android || true

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Ensure Android Manifest Permissions and Launcher Icons
        run: |
          manifest_file="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.VIBRATE" "$manifest_file"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.VIBRATE" />' "$manifest_file"
          fi
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' "$manifest_file"
          sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' "$manifest_file"

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          cat << 'EOF_GRADLE' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF_GRADLE

          cat << 'EOF_APP_GRADLE' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              modules {
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
                  }
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
                  }
              }
          }
          EOF_APP_GRADLE

      - name: Generate and Inject Android Launcher Icons
        run: |
          cat << 'EOF_PY' > generate_icons.py
          import os
          from PIL import Image, ImageDraw

          candidates = ['icon.png', 'icon_rounded.png', 'android-chrome-512x512.png', 'apple-touch-icon.png', 'android-chrome-192x192.png', 'www/icon.png']
          src_icon = next((f for f in candidates if os.path.exists(f)), None)

          if not src_icon:
              print('Warning: No icon file found among:', candidates)
              exit(1)

          print(f'Using source icon: {src_icon}')
          img = Image.open(src_icon).convert('RGBA')

          res_dir = 'android/app/src/main/res'
          densities = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432),
          }

          def round_corners(image, radius):
              mask = Image.new('L', image.size, 0)
              draw = ImageDraw.Draw(mask)
              draw.rounded_rectangle([(0, 0), image.size], radius=radius, fill=255)
              out = image.copy()
              out.putalpha(mask)
              return out

          for folder, (size, fg_size) in densities.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)

              # 1. Standard and Round legacy icons
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              squircle = round_corners(resized, int(size * 0.22))
              squircle.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              squircle.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')

              # 2. Adaptive launcher foreground icon (centered within 72% safe zone)
              fg = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              inner_dim = int(fg_size * 0.72)
              inner_img = img.resize((inner_dim, inner_dim), Image.Resampling.LANCZOS)
              offset = (fg_size - inner_dim) // 2
              fg.paste(inner_img, (offset, offset), inner_img)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          # 3. Adaptive icon background color
          values_dir = os.path.join(res_dir, 'values')
          os.makedirs(values_dir, exist_ok=True)
          with open(os.path.join(values_dir, 'ic_launcher_background.xml'), 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0d0f18</color>\n</resources>\n')

          # 4. Adaptive icon XML configuration for API 26+
          anydpi_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          with open(os.path.join(anydpi_dir, 'ic_launcher.xml'), 'w') as f:
              f.write(adaptive_xml)
          with open(os.path.join(anydpi_dir, 'ic_launcher_round.xml'), 'w') as f:
              f.write(adaptive_xml)

          print('Successfully generated and configured all Android launcher and adaptive icons.')
          EOF_PY
          python3 generate_icons.py

      - name: Build Android App (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$apk_file" ]; then
            cp "$apk_file" drift-app.apk
            gh release upload latest drift-app.apk --clobber || gh release create latest drift-app.apk --title "Latest APK Build"
            echo "Successfully published drift-app.apk to latest release!"
          else
            echo "Error: APK file not found!"
