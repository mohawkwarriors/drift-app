name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "drift_20260920.html" ]; then
            cp drift_20260920.html www/index.html
          else
            cp *.html www/index.html
          fi
          [ -f "manifest.json" ] && cp manifest.json www/ || true

      - name: Setup Capacitor & Generate Android Project
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Drift" "com.mohawkwarriors.drift" --web-dir www
          fi
          
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drift-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
