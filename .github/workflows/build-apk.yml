name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Install Dependencies & Capacitor
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/haptics
          mkdir -p www
          cp -r index.html site.webmanifest manifest.json icon.png apple-touch-icon.png favicon* android-chrome* www/ || true

      - name: Initialize & Add Android Platform
        run: |
          npx cap init Drift com.mohawkwarriors.drift --web-dir www || true
          npx cap add android || true
          npx cap sync android

      - name: Ensure Vibrate Permission in Android Manifest
        run: |
          if ! grep -q "android.permission.VIBRATE" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          python -c "
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              content = f.read()

          fix = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
          '''

          if 'exclude group: \'org.jetbrains.kotlin\'' not in content:
              content = content.replace('dependencies {', fix, 1)
              with open(app_gradle, 'w') as f:
                  f.write(content)
              print('Successfully patched android/app/build.gradle to resolve Kotlin duplicate classes')
          "

      - name: Inject Rounded Launcher Icons
        continue-on-error: true
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw

          # Paths
          base_dir = 'android/app/src/main/res'
          icon_src = 'icon.png'

          if not os.path.exists(icon_src):
              print('icon.png not found, skipping icon generation')
              exit(0)

          img = Image.open(icon_src).convert('RGBA')

          mipmap_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          def round_corners(image, radius):
              mask = Image.new('L', image.size, 0)
              draw = ImageDraw.Draw(mask)
              draw.rounded_rectangle([(0, 0), image.size], radius=radius, fill=255)
              rounded = image.copy()
              rounded.putalpha(mask)
              return rounded

          for folder, size in mipmap_sizes.items():
              target_dir = os.path.join(base_dir, folder)
              os.makedirs(target_dir, exist_ok=True)

              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              radius = int(size * 0.225)
              squircle = round_corners(resized, radius)

              squircle.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              squircle.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
          print('Successfully generated launcher icons!')
          "

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drift-App-Debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -f "$apk_file" ]; then
            cp "$apk_file" drift-app.apk
            gh release upload latest drift-app.apk --clobber || gh release create latest drift-app.apk --title "Latest APK Build"
            echo "Successfully published drift-app.apk to latest release!"
          else
            echo "Error: APK file not found!"
            exit 1
          fi
